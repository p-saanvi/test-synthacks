<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Set — Health 360</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>Health 360</h1>
  </header>

  <div class="layout">
    <div class="card">
      <h2>You're all set! ✅</h2>
      <p class="hint">
        Your profile, emergency contacts, and insurance are saved.
      </p>
      <a class="btn" id="triage-link" href="#" style="display: none;">
        Continue to Symptom Check
      </a>
      <form id="logout-form">
        <button type="button" class="secondary" id="logout-btn">Sign Out</button>
      </form>
    </div>

    <aside class="profile-sidebar">
      <h3>Your Profile</h3>
      <div id="profile-sidebar-content">
        <p class="empty-hint">Loading…</p>
      </div>
    </aside>
  </div>

  <script src="api.js"></script>
  <script>
    (async function loadProfile() {
      try {
        const { profile } = await api.get('/api/profile');
        const { contacts } = await api.get('/api/contacts');
        renderProfileSidebar(document.getElementById('profile-sidebar-content'), { profile, contacts });

        // send-profile is safe to call again here — it just confirms the
        // profile is complete and hands back the link to the AI triage app.
        const { triageUrl } = await api.post('/api/ai/send-profile', {});
        if (triageUrl) {
          const link = document.getElementById('triage-link');
          link.href = triageUrl;
          link.style.display = '';
        }
      } catch (e) {
        // Not logged in or nothing saved yet — leave the sidebar's loading state as-is.
      }
    })();

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await api.post('/api/auth/logout');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
